<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f5f7;color:#1a1a2e}

.soon{background:#fff3cd;font-weight:600}.tip{font-size:12px;color:#666}
